name: Publish Meadow Run to GitHub Pages

on:
  push:
    paths:
      - 'WebGL/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out compiled website
        uses: actions/checkout@v4
        with:
          sparse-checkout: WebGL
          fetch-depth: 1
      - name: Verify compiled website checksums
        working-directory: WebGL
        run: sha256sum --check SHA256SUMS.txt
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: WebGL
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
